<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#0f0f10" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<style>
			html {
				background: #0f0f10;
			}
			html:not(.ready) body {
				opacity: 0;
			}
		</style>
		<noscript><style>html:not(.ready) body { opacity: 1; }</style></noscript>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			(function () {
				var root = document.documentElement;
				var show = function () {
					root.classList.add('ready');
				};
				var tinted = new Promise(function (r) {
					window.tint_done = r;
				});
				Promise.race([
					Promise.all([
						document.fonts ? document.fonts.load('600 1em "Outfit Variable"') : null,
						document.fonts ? document.fonts.ready : null,
						tinted
					]),
					new Promise(function (r) {
						setTimeout(r, 1500);
					})
				]).then(show, show);
			})();
		</script>
	</body>
</html>
